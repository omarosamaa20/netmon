[workspace]
members = [
    "crates/capture",
    "crates/resolver",
    "crates/aggregator",
    "crates/controller",
    "crates/gui",
]
resolver = "2"

[workspace.dependencies]
pcap = { version = "2", features = ["capture-stream"] }
egui = "0.28"
eframe = { version = "0.28", features = ["default"] }
egui_plot = "0.28"
nix = { version = "0.29", features = ["user", "process"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "1"
